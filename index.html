<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paints the phone's browser bar in the same dark color as the app -->
    <meta name="theme-color" content="#0D1117" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Tus rutinas, el catálogo de ejercicios y tu registro de entrenamientos." />
    <!-- Icons (made from public/icon.svg with `npm run icons`). The manifest
         (name, icons, full screen when installed) is added by vite-plugin-pwa. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- iPhone, once added to the home screen: its name, full screen, dark status bar -->
    <meta name="apple-mobile-web-app-title" content="Respawn" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Respawn Fitness</title>
    <!-- The theme chosen in the menu (src/store/theme.js), applied before the
         first paint so a light theme never flashes dark while the app loads -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        var bars = { claro: "#f6f8fa", inca: "#f4f1ea" };
        if (bars[theme]) {
          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", bars[theme]);
          document.querySelector('meta[name="color-scheme"]').setAttribute("content", "light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
